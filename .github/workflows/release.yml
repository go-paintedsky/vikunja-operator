name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to release (for example v0.1.2)
        type: string
        required: true

permissions: {}

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image repository
        run: echo "KO_DOCKER_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build release manifests
        run: |
          set -euo pipefail
          make manifests generate kustomize
          mkdir -p out/release-overlay out/release-overlay-nocrds
          cp config/default/metrics_service.yaml config/default/manager_metrics_patch.yaml \
            out/release-overlay-nocrds/

          cat > out/release-overlay/kustomization.yaml <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
          - ../../config/default
          images:
          - name: controller
            newName: ${KO_DOCKER_REPO}
            newTag: ${RELEASE_TAG}
          EOF

          cat > out/release-overlay-nocrds/kustomization.yaml <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          namespace: vikunja-operator-system
          namePrefix: vikunja-operator-
          resources:
          - ../../config/rbac
          - ../../config/manager
          - metrics_service.yaml
          patches:
          - path: manager_metrics_patch.yaml
            target:
              kind: Deployment
          images:
          - name: controller
            newName: ${KO_DOCKER_REPO}
            newTag: ${RELEASE_TAG}
          EOF

          ./bin/kustomize build out/release-overlay > out/vikunja-operator.yaml
          ./bin/kustomize build config/crd > out/vikunja-operator.crds.yaml
          ./bin/kustomize build out/release-overlay-nocrds > out/vikunja-operator.no-crds.yaml


      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2.18"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KO_DOCKER_REPO: ${{ env.KO_DOCKER_REPO }}
