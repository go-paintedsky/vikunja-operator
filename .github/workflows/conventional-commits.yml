name: Conventional Commits

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  commitlint:
    name: Lint commits and PR title
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # Official commitlint packages from conventional-changelog.
      # There is no first-party GitHub Action for Conventional Commits.
      - name: Install commitlint
        run: npm install --no-save @commitlint/cli@21.2.3 @commitlint/config-conventional@21.2.3

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --config .github/scripts/commitlint.config.mjs --verbose

      - name: Lint commits
        run: >
          npx commitlint
          --config .github/scripts/commitlint.config.mjs
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
