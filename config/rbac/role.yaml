---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - vikunja.paintedsky.io
  resources:
  - labels
  - projects
  - tasks
  - teams
  - vikunjainstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - vikunja.paintedsky.io
  resources:
  - labels/finalizers
  - projects/finalizers
  - tasks/finalizers
  - teams/finalizers
  - vikunjainstances/finalizers
  verbs:
  - update
- apiGroups:
  - vikunja.paintedsky.io
  resources:
  - labels/status
  - projects/status
  - tasks/status
  - teams/status
  - vikunjainstances/status
  verbs:
  - get
  - patch
  - update
