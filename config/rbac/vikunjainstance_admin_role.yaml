# This rule is not used by the project vikunja-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over vikunja.paintedsky.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: vikunja-operator
    app.kubernetes.io/managed-by: kustomize
  name: vikunjainstance-admin-role
rules:
- apiGroups:
  - vikunja.paintedsky.io
  resources:
  - vikunjainstances
  verbs:
  - '*'
- apiGroups:
  - vikunja.paintedsky.io
  resources:
  - vikunjainstances/status
  verbs:
  - get
