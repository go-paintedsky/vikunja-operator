---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tasks.vikunja.paintedsky.io
spec:
  group: vikunja.paintedsky.io
  names:
    kind: Task
    listKind: TaskList
    plural: tasks
    singular: task
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.title
      name: Title
      type: string
    - jsonPath: .status.identifier
      name: Identifier
      type: string
    - jsonPath: .spec.done
      name: Done
      type: boolean
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Task is the Schema for the tasks API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Task
            properties:
              assignees:
                description: |-
                  assignees is a list of Vikunja usernames to assign to this task. The
                  operator adds and removes assignees on the task to match this list exactly.
                  Usernames must already exist on the Vikunja instance and have access to
                  the task's project.
                items:
                  type: string
                type: array
              description:
                description: description is an optional longer description of the
                  task.
                type: string
              done:
                description: done marks the task as completed.
                type: boolean
              dueDate:
                description: dueDate is when the task is due.
                format: date-time
                type: string
              endDate:
                description: endDate is when the task ends.
                format: date-time
                type: string
              hexColor:
                description: |-
                  hexColor is the hex color code of this task, without the leading '#',
                  e.g. "ff8800".
                pattern: ^[0-9a-fA-F]{6}$
                type: string
              labelRefs:
                description: |-
                  labelRefs is a list of names of Label resources, in the same namespace, to
                  attach to this task. The operator adds and removes labels on the task to
                  match this list exactly.
                items:
                  type: string
                type: array
              priority:
                description: 'priority of the task: 0 = unset, 1 = low, 2 = medium,
                  3 = high, 4 = urgent, 5 = DO NOW.'
                format: int64
                maximum: 5
                minimum: 0
                type: integer
              projectRef:
                description: |-
                  projectRef is the name of the Project resource, in the same namespace,
                  this task belongs to. The instance to create the task on is taken from
                  the referenced Project.
                minLength: 1
                type: string
              startDate:
                description: startDate is when the task starts.
                format: date-time
                type: string
              title:
                description: title of the task.
                minLength: 1
                type: string
            required:
            - projectRef
            - title
            type: object
          status:
            description: status defines the observed state of Task
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Task resource.

                  The "Ready" condition is True when the task, its labels and its assignees
                  have been created or updated on the target VikunjaInstance to match spec.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: id is the numeric id Vikunja assigned to this task.
                format: int64
                type: integer
              identifier:
                description: |-
                  identifier is the textual task identifier Vikunja assigned, derived from
                  the project identifier and the task index (e.g. "PROJ-12").
                type: string
              index:
                description: index is the per-project task index Vikunja assigned.
                format: int64
                type: integer
              observedGeneration:
                description: observedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
